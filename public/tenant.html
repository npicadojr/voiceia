<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice AI — Detalle cliente</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a; --accent: #6c63ff;
    --accent-dim: #6c63ff22; --text: #e2e8f0; --muted: #64748b; --green: #22c55e;
    --red: #ef4444; --yellow: #f59e0b;
  }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { display: flex; align-items: center; gap: 1rem; padding: 1rem 2rem; border-bottom: 1px solid var(--border); background: var(--surface); }
  .back-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: .875rem; }
  .back-btn:hover { color: var(--text); }
  header h1 { font-size: 1.1rem; font-weight: 600; }
  main { max-width: 1000px; margin: 0 auto; padding: 2rem; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
  .card h3 { font-size: .875rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 1rem; }
  .field { margin-bottom: .85rem; }
  label { display: block; font-size: .75rem; color: var(--muted); margin-bottom: .3rem; font-weight: 500; }
  input, textarea { width: 100%; padding: .5rem .75rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: .875rem; outline: none; resize: vertical; }
  input:focus, textarea:focus { border-color: var(--accent); }
  .btn { display: inline-flex; align-items: center; gap: .4rem; padding: .45rem .9rem; border-radius: 8px; font-size: .8rem; font-weight: 500; cursor: pointer; border: none; transition: opacity .15s; }
  .btn:hover { opacity: .85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-danger { background: transparent; border: 1px solid var(--red); color: var(--red); }
  .webhook-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: .75rem 1rem; font-family: monospace; font-size: .78rem; color: var(--green); word-break: break-all; }
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
  .tab { padding: .6rem 1.1rem; font-size: .875rem; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); background: none; border-top: none; border-left: none; border-right: none; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); font-size: .85rem; }
  th { padding: .65rem 1rem; text-align: left; font-size: .7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; background: var(--bg); }
  td { padding: .75rem 1rem; border-top: 1px solid var(--border); }
  tr:hover td { background: var(--accent-dim); }
  .badge { display: inline-flex; align-items: center; padding: .2rem .55rem; border-radius: 99px; font-size: .68rem; font-weight: 600; }
  .badge-green { background: #22c55e22; color: var(--green); }
  .badge-yellow { background: #f59e0b22; color: var(--yellow); }
  .badge-red { background: #ef444422; color: var(--red); }
  .badge-blue { background: #3b82f622; color: #60a5fa; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .toast { display: none; position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--surface); border: 1px solid var(--green); border-radius: 10px; padding: .75rem 1.25rem; font-size: .85rem; z-index: 200; }
  .toast.show { display: block; }
</style>
</head>
<body>

<header>
  <button class="back-btn" onclick="goBack()">← Volver</button>
  <h1 id="tenantName">Cargando…</h1>
  <span id="tenantSlug" style="font-size:.8rem;color:var(--muted);margin-left:.5rem"></span>
</header>

<main>
  <div class="grid2">
    <!-- Config general -->
    <div class="card">
      <h3>Configuración general</h3>
      <div class="field"><label>Nombre</label><input id="c-name" /></div>
      <div class="field"><label>Número Twilio</label><input id="c-phone" placeholder="+15551234567" /></div>
      <div class="field"><label>ElevenLabs Voice ID</label><input id="c-voice" /></div>
      <div class="field"><label>Número agente humano</label><input id="c-human" /></div>
      <div style="display:flex;gap:.5rem;margin-top:.5rem">
        <button class="btn btn-primary" onclick="saveConfig()">Guardar</button>
        <button class="btn btn-danger" onclick="toggleActive()">Desactivar</button>
      </div>
    </div>

    <!-- Webhook + API Key -->
    <div class="card">
      <h3>Webhook Twilio</h3>
      <p style="font-size:.8rem;color:var(--muted);margin-bottom:.75rem">Pega esta URL en tu número Twilio → Voice webhook:</p>
      <div class="webhook-box" id="webhookUrl">—</div>
      <button class="btn btn-ghost" style="margin-top:.75rem;font-size:.75rem" onclick="copyWebhook()">Copiar URL</button>
      <div style="margin-top:1.25rem">
        <h3 style="font-size:.875rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem">API Key del cliente</h3>
        <div class="webhook-box" id="tenantApiKey">—</div>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('calls')">Llamadas</button>
    <button class="tab" onclick="switchTab('agents')">Agentes</button>
  </div>

  <!-- Calls panel -->
  <div id="tab-calls" class="tab-panel active">
    <div class="section-header">
      <span style="font-size:.875rem;color:var(--muted)" id="callCount">—</span>
      <button class="btn btn-ghost" onclick="loadCalls()">↻ Actualizar</button>
    </div>
    <div id="callsTable"><p style="color:var(--muted);font-size:.875rem">Cargando…</p></div>
  </div>

  <!-- Agents panel -->
  <div id="tab-agents" class="tab-panel">
    <p style="font-size:.8rem;color:var(--muted);margin-bottom:1.25rem">Personaliza el prompt y saludo de cada agente para este cliente. Si lo dejas vacío, se usará el prompt por defecto.</p>
    <div id="agentForms"></div>
  </div>
</main>

<div class="toast" id="toast">✅ Guardado</div>

<script>
  const params = new URLSearchParams(location.search);
  const tenantId = params.get('id');
  const adminKey = params.get('key') || '';
  let tenantData = null;

  const AGENT_LABELS = {
    leadQualifier: 'Calificador de Leads',
    appointmentBooker: 'Agendador de Citas',
    surveyor: 'Encuestador',
    support: 'Soporte Nivel 1',
  };

  async function init() {
    const res = await fetch(`/admin/tenants/${tenantId}`, { headers: { 'x-api-key': adminKey } });
    if (!res.ok) { document.body.innerHTML = '<div style="padding:2rem;color:#ef4444">No autorizado o cliente no encontrado.</div>'; return; }
    tenantData = await res.json();

    document.getElementById('tenantName').textContent = tenantData.name;
    document.getElementById('tenantSlug').textContent = `/${tenantData.slug}`;
    document.getElementById('c-name').value  = tenantData.name || '';
    document.getElementById('c-phone').value = tenantData.phone_number || '';
    document.getElementById('c-voice').value = tenantData.elevenlabs_voice_id || '';
    document.getElementById('c-human').value = tenantData.human_agent_number || '';
    document.getElementById('tenantApiKey').textContent = tenantData.api_key;

    const baseUrl = window.location.origin;
    document.getElementById('webhookUrl').textContent = `${baseUrl}/twilio/voice?tenant=${tenantData.slug}`;

    loadCalls();
    renderAgentForms();
  }

  async function loadCalls() {
    const res = await fetch(`/admin/tenants/${tenantId}/calls?limit=20`, { headers: { 'x-api-key': adminKey } });
    const { calls } = await res.json();
    document.getElementById('callCount').textContent = `${calls.length} llamadas recientes`;

    if (!calls.length) { document.getElementById('callsTable').innerHTML = '<p style="color:var(--muted);font-size:.875rem">Sin llamadas aún.</p>'; return; }

    const statusBadge = s => {
      const map = { completed:'badge-green', 'in-progress':'badge-blue', failed:'badge-red', transferred:'badge-yellow' };
      return `<span class="badge ${map[s] || 'badge-yellow'}">${s}</span>`;
    };

    const rows = calls.map(c => `
      <tr>
        <td style="font-family:monospace;font-size:.75rem;color:var(--muted)">${c.call_sid?.slice(-8) || c.id.slice(-8)}</td>
        <td>${c.direction === 'outbound' ? '↗ Saliente' : '↙ Entrante'}</td>
        <td>${esc(c.from_number || '—')} → ${esc(c.to_number || '—')}</td>
        <td>${esc(c.agent_type)}</td>
        <td>${statusBadge(c.status)}</td>
        <td style="color:var(--muted);font-size:.78rem">${new Date(c.created_at).toLocaleString('es')}</td>
      </tr>
    `).join('');

    document.getElementById('callsTable').innerHTML = `
      <table>
        <thead><tr><th>SID</th><th>Dirección</th><th>Números</th><th>Agente</th><th>Estado</th><th>Fecha</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function renderAgentForms() {
    const configs = {};
    (tenantData.agent_configs || []).forEach(c => { configs[c.agent_type] = c; });

    const html = Object.entries(AGENT_LABELS).map(([type, label]) => {
      const cfg = configs[type] || {};
      return `
        <div class="card" style="margin-bottom:1rem">
          <h3>${label}</h3>
          <div class="field"><label>Saludo de bienvenida</label>
            <input id="ag-greeting-${type}" value="${esc(cfg.greeting_text || '')}" placeholder="Hola, soy..."/>
          </div>
          <div class="field"><label>System prompt</label>
            <textarea id="ag-prompt-${type}" rows="5" placeholder="Eres un asistente...">${esc(cfg.system_prompt || '')}</textarea>
          </div>
          <button class="btn btn-primary" onclick="saveAgent('${type}')">Guardar agente</button>
        </div>`;
    }).join('');

    document.getElementById('agentForms').innerHTML = html;
  }

  async function saveConfig() {
    const fields = {
      name: document.getElementById('c-name').value.trim(),
      phone_number: document.getElementById('c-phone').value.trim() || null,
      elevenlabs_voice_id: document.getElementById('c-voice').value.trim() || null,
      human_agent_number: document.getElementById('c-human').value.trim() || null,
    };
    const res = await fetch(`/admin/tenants/${tenantId}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-api-key': adminKey }, body: JSON.stringify(fields),
    });
    if (res.ok) showToast('✅ Configuración guardada');
    else showToast('❌ Error al guardar');
  }

  async function toggleActive() {
    if (!confirm('¿Seguro que quieres desactivar este cliente?')) return;
    await fetch(`/admin/tenants/${tenantId}`, {
      method: 'DELETE', headers: { 'x-api-key': adminKey },
    });
    showToast('Cliente desactivado');
    setTimeout(goBack, 1500);
  }

  async function saveAgent(type) {
    const body = {
      systemPrompt: document.getElementById(`ag-prompt-${type}`).value.trim() || null,
      greetingText: document.getElementById(`ag-greeting-${type}`).value.trim() || null,
    };
    const res = await fetch(`/admin/tenants/${tenantId}/agents/${type}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-api-key': adminKey }, body: JSON.stringify(body),
    });
    if (res.ok) showToast(`✅ Agente "${AGENT_LABELS[type]}" guardado`);
    else showToast('❌ Error al guardar');
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['calls','agents'][i] === name));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById(`tab-${name}`).classList.add('active');
  }

  function copyWebhook() { navigator.clipboard.writeText(document.getElementById('webhookUrl').textContent); showToast('URL copiada'); }
  function goBack() { window.location.href = `/dashboard/?key=${encodeURIComponent(adminKey)}`; }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
  function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice AI — Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a; --accent: #6c63ff;
    --accent-dim: #6c63ff22; --text: #e2e8f0; --muted: #64748b; --green: #22c55e;
    --red: #ef4444; --yellow: #f59e0b;
  }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; border-bottom: 1px solid var(--border); background: var(--surface); }
  header h1 { font-size: 1.1rem; font-weight: 600; color: var(--accent); letter-spacing: -.02em; }
  header span { font-size: .75rem; color: var(--muted); }
  main { max-width: 1100px; margin: 0 auto; padding: 2rem; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  h2 { font-size: 1.25rem; font-weight: 600; }
  .btn { display: inline-flex; align-items: center; gap: .4rem; padding: .5rem 1rem; border-radius: 8px; font-size: .875rem; font-weight: 500; cursor: pointer; border: none; transition: opacity .15s; }
  .btn:hover { opacity: .85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
  thead tr { background: var(--bg); }
  th { padding: .75rem 1rem; text-align: left; font-size: .75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  td { padding: .875rem 1rem; font-size: .875rem; border-top: 1px solid var(--border); }
  tr:hover td { background: var(--accent-dim); }
  .badge { display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .6rem; border-radius: 99px; font-size: .7rem; font-weight: 600; }
  .badge-green { background: #22c55e22; color: var(--green); }
  .badge-red { background: #ef444422; color: var(--red); }
  .link-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: .875rem; text-decoration: underline; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: #00000088; z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; width: 100%; max-width: 480px; }
  .modal h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1.5rem; }
  .field { margin-bottom: 1rem; }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .4rem; font-weight: 500; }
  input, select { width: 100%; padding: .55rem .75rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: .875rem; outline: none; }
  input:focus, select:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: .75rem; justify-content: flex-end; margin-top: 1.5rem; }
  .empty { text-align: center; padding: 3rem; color: var(--muted); font-size: .875rem; }
  .api-key-toast { display: none; position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--surface); border: 1px solid var(--green); border-radius: 12px; padding: 1rem 1.25rem; z-index: 200; max-width: 400px; }
  .api-key-toast.show { display: block; }
  .api-key-toast p { font-size: .8rem; color: var(--muted); margin-bottom: .5rem; }
  .api-key-toast code { font-family: monospace; font-size: .8rem; color: var(--green); word-break: break-all; }
  #authBar { background: var(--surface); border-bottom: 1px solid var(--border); padding: .75rem 2rem; display: flex; gap: .75rem; align-items: center; }
  #authBar label { font-size: .8rem; color: var(--muted); white-space: nowrap; }
  #authBar input { max-width: 360px; }
</style>
</head>
<body>

<header>
  <h1>🎙 Voice AI Platform</h1>
  <span id="userHint">Ingresa tu Admin API Key abajo</span>
</header>

<div id="authBar">
  <label for="apiKeyInput">Admin API Key:</label>
  <input type="password" id="apiKeyInput" placeholder="vk_..." />
  <button class="btn btn-primary" onclick="loadTenants()">Cargar</button>
</div>

<main>
  <div class="top-bar">
    <h2>Clientes</h2>
    <button class="btn btn-primary" onclick="openModal()">+ Nuevo cliente</button>
  </div>

  <div id="tableContainer">
    <div class="empty">Ingresa tu Admin API Key y haz clic en Cargar.</div>
  </div>
</main>

<!-- New tenant modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Nuevo cliente</h3>
    <div class="field"><label>Nombre *</label><input id="f-name" placeholder="Empresa ABC" /></div>
    <div class="field"><label>Slug * (URL-friendly)</label><input id="f-slug" placeholder="empresa-abc" /></div>
    <div class="field"><label>Número Twilio (E.164)</label><input id="f-phone" placeholder="+15551234567" /></div>
    <div class="field"><label>ElevenLabs Voice ID</label><input id="f-voice" placeholder="21m00Tcm4TlvDq8ikWAM" /></div>
    <div class="field"><label>Número agente humano</label><input id="f-human" placeholder="+15557654321" /></div>
    <div class="field"><label>Agente por defecto</label>
      <select id="f-agent">
        <option value="leadQualifier">Calificador de Leads</option>
        <option value="appointmentBooker">Agendador de Citas</option>
        <option value="surveyor">Encuestador</option>
        <option value="support">Soporte Nivel 1</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="createTenant()">Crear cliente</button>
    </div>
  </div>
</div>

<!-- API key toast -->
<div class="api-key-toast" id="apiKeyToast">
  <p>✅ Cliente creado. Guarda esta API Key (no se volverá a mostrar):</p>
  <code id="newApiKey"></code>
  <br><br>
  <button class="btn btn-ghost" style="font-size:.75rem" onclick="copyKey()">Copiar</button>
  <button class="btn btn-ghost" style="font-size:.75rem" onclick="hideToast()">Cerrar</button>
</div>

<script>
  let _key = '';

  function apiKey() {
    return _key || document.getElementById('apiKeyInput').value.trim();
  }

  async function loadTenants() {
    _key = document.getElementById('apiKeyInput').value.trim();
    const res = await fetch('/admin/tenants', { headers: { 'x-api-key': _key } });
    if (!res.ok) {
      document.getElementById('tableContainer').innerHTML = '<div class="empty">❌ API Key inválida o error del servidor.</div>';
      return;
    }
    const { tenants } = await res.json();
    renderTable(tenants);
  }

  function renderTable(tenants) {
    if (!tenants.length) {
      document.getElementById('tableContainer').innerHTML = '<div class="empty">No hay clientes aún. Crea el primero.</div>';
      return;
    }
    const rows = tenants.map(t => `
      <tr>
        <td><strong>${esc(t.name)}</strong><br><span style="color:var(--muted);font-size:.75rem">${esc(t.slug)}</span></td>
        <td style="font-family:monospace;font-size:.8rem">${esc(t.phone_number || '—')}</td>
        <td><span class="badge ${t.active ? 'badge-green' : 'badge-red'}">${t.active ? '● Activo' : '○ Inactivo'}</span></td>
        <td style="font-family:monospace;font-size:.75rem;color:var(--muted)">${esc(t.api_key.slice(0, 16))}…</td>
        <td>
          <button class="link-btn" onclick="goDetail('${t.id}')">Ver detalle →</button>
        </td>
      </tr>
    `).join('');

    document.getElementById('tableContainer').innerHTML = `
      <table>
        <thead><tr><th>Cliente</th><th>Número</th><th>Estado</th><th>API Key</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function goDetail(id) {
    window.location.href = `/dashboard/tenant.html?id=${id}&key=${encodeURIComponent(apiKey())}`;
  }

  function openModal() { document.getElementById('modal').classList.add('open'); }
  function closeModal() { document.getElementById('modal').classList.remove('open'); }

  async function createTenant() {
    const body = {
      name: document.getElementById('f-name').value.trim(),
      slug: document.getElementById('f-slug').value.trim(),
      phoneNumber: document.getElementById('f-phone').value.trim() || undefined,
      voiceId: document.getElementById('f-voice').value.trim() || undefined,
      humanAgentNumber: document.getElementById('f-human').value.trim() || undefined,
      defaultAgent: document.getElementById('f-agent').value,
    };
    if (!body.name || !body.slug) return alert('Nombre y slug son requeridos.');

    const res = await fetch('/admin/tenants', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey() },
      body: JSON.stringify(body),
    });
    if (!res.ok) { const e = await res.json(); return alert('Error: ' + e.error); }
    const tenant = await res.json();
    closeModal();
    showApiKey(tenant.api_key);
    loadTenants();
  }

  function showApiKey(key) {
    document.getElementById('newApiKey').textContent = key;
    document.getElementById('apiKeyToast').classList.add('show');
  }
  function hideToast() { document.getElementById('apiKeyToast').classList.remove('show'); }
  function copyKey() { navigator.clipboard.writeText(document.getElementById('newApiKey').textContent); }

  function esc(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
